<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar – Oaktree Meeting Room Booking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .view-toggle { display:flex; gap:4px; background:var(--grey-bg); border-radius:var(--radius-sm); padding:3px; border:1px solid var(--grey-border); }
    .view-btn { padding:6px 14px; border:none; background:none; font-size:13px; font-weight:500; color:var(--text-muted); border-radius:4px; cursor:pointer; font-family:inherit; transition:all .2s; }
    .view-btn.active { background:var(--white); color:var(--navy); font-weight:600; box-shadow:var(--shadow-sm); }
    .room-filter { display:flex; gap:6px; }
    .room-chip { padding:5px 12px; border:1.5px solid var(--grey-border); border-radius:20px; font-size:12px; font-weight:600; cursor:pointer; transition:all .2s; color:var(--text-muted); }
    .room-chip.active-oak  { border-color:var(--navy);  background:rgba(27,42,74,.07);  color:var(--navy); }
    .room-chip.active-tree { border-color:var(--green); background:rgba(42,92,69,.07);  color:var(--green); }
    .room-chip.active-all  { border-color:var(--gold);  background:rgba(201,168,76,.1); color:var(--navy); }
    .day-header-date { font-size:13px; color:var(--text-muted); display:block; margin-top:1px; }
    .today-marker { display:inline-block; width:6px; height:6px; background:var(--gold); border-radius:50%; margin-left:4px; vertical-align:middle; }
  </style>
</head>
<body>
<div class="app-container">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark" id="sidebarLogoMark">OG</div>
      <div class="logo-text"><span class="company-name">Oaktree Group</span><span class="system-name">Meeting Room Booking</span></div>
    </div>
    <nav class="sidebar-nav">
      <span class="nav-label">Main Menu</span>
      <a href="/" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg><span>Dashboard</span></a>
      <a href="/book" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg><span>Book a Room</span></a>
      <a href="/calendar" class="nav-item active"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>Calendar</span></a>
      <a href="/my-bookings" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg><span>My Bookings</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="nav-divider"></div>
      <a href="/admin" class="nav-item admin-link"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span>Admin Panel</span></a>
      <button class="theme-toggle" id="themeToggle"><svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><span id="themeLabel">Dark Mode</span></button>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <button class="sidebar-toggle" id="sidebarToggle"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="topbar-title">Schedule &amp; Calendar</div>
      <div class="topbar-right">
        <span class="internal-badge">Internal Tool</span>
        <div class="date-display" id="currentDate"></div>
      </div>
    </header>

    <div class="page-content">
      <!-- Controls -->
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
          <!-- Date Nav -->
          <div style="display:flex;align-items:center;gap:8px;">
            <button class="btn btn-outline btn-sm" id="prevBtn">← Prev</button>
            <button class="btn btn-outline btn-sm" id="todayBtn">Today</button>
            <button class="btn btn-outline btn-sm" id="nextBtn">Next →</button>
          </div>
          <h2 id="calTitle" style="font-size:16px;font-weight:700;color:var(--text-primary);margin:0;min-width:180px;"></h2>
        </div>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <!-- Room Filter -->
          <div class="room-filter">
            <div class="room-chip active-all" data-filter="all" id="filterAll">All Rooms</div>
            <div class="room-chip" data-filter="oak_room" id="filterOak">Oak Room</div>
            <div class="room-chip" data-filter="tree_room" id="filterTree">Tree Room</div>
          </div>
          <!-- View Toggle -->
          <div class="view-toggle">
            <button class="view-btn active" id="btnDay">Day</button>
            <button class="view-btn" id="btnWeek">Week</button>
          </div>
          <a href="/book" class="btn btn-gold btn-sm">+ Book</a>
        </div>
      </div>

      <!-- Legend -->
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:14px;flex-wrap:wrap;">
        <span style="font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;">Legend:</span>
        <span style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--navy);"><span style="width:12px;height:12px;background:rgba(27,42,74,.12);border-left:3px solid var(--navy);display:inline-block;border-radius:2px;"></span> Oak Room</span>
        <span style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--green);"><span style="width:12px;height:12px;background:rgba(42,92,69,.1);border-left:3px solid var(--green);display:inline-block;border-radius:2px;"></span> Tree Room</span>
        <span style="display:flex;align-items:center;gap:5px;font-size:12px;color:#6B7280;"><span style="width:12px;height:12px;background:#F3F4F6;border-left:3px solid #9CA3AF;display:inline-block;border-radius:2px;"></span> Blocked</span>
      </div>

      <!-- Calendar Container -->
      <div class="card" style="overflow:hidden">
        <div id="calendarContainer">
          <div class="empty-state" style="padding:60px 0">
            <div class="spinner spinner-dark"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Booking Detail Modal -->
<div class="modal-overlay" id="bookingModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Booking Details</div>
      <button class="modal-close" id="modalClose"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="booking-detail" id="modalContent"></div>
    </div>
    <div class="modal-footer">
      <a href="/book" class="btn btn-gold btn-sm">+ Book This Room</a>
      <button class="btn btn-outline btn-sm" id="modalCloseBtn">Close</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="/js/app.js"></script>
<script src="/js/calendar.js"></script>
</body>
</html>
